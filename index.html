<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>
</head>
<body style="background:black; color:white; text-align:center; margin-top:100px;">

    <h1>Добро пожаловать</h1>

    <audio id="music" autoplay loop>
        <source src="diadia-sasha-10x.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Попытка автозапуска
        const audio = document.getElementById("music");

        audio.play().catch(() => {
            console.log("Браузер заблокировал автозапуск");
        });

        // Если браузер заблокировал — включится после первого клика
        document.addEventListener("click", () => {
            audio.play();
        }, { once: true });
    </script>

</body>
</html>
